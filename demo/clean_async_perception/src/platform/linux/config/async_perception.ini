[application]
# playback: BAG 回放；live: 实时 Orbbec 设备；ros: ROS2 图像话题。
mode=ros

[reporting]
enable_json_lines=false
sensor_id=orbbec_rgbd
pipeline_id=rgbd_async_v1

[web_preview]
# 启用后访问 http://<设备IP>:8080/ 查看左侧原图、右侧推理叠加图及实时性能。
# 0.0.0.0 允许局域网访问；如只允许本机查看可改为 127.0.0.1。
enabled=true
bind_address=0.0.0.0
port=8080
jpeg_quality=80
max_fps=10

[playback]
bag_path=/data/input/example.bag
output_directory=./mp4_output

[live]
device_uid=
output_directory=./mp4_output

[ros]
image_topic=/camera/color/image_raw
camera_info_topic=/camera/color/camera_info
queue_capacity=2
output_directory=./mp4_output

[ipm]
# 相机离地面高度 (米)
camera_height_m=1.05
# 相机俯仰角 (度)，正值=向下倾斜
pitch_deg=50.0
# 相机横滚角 (度)
roll_deg=0.0
# 相机偏航角 (度)
yaw_deg=0.0
# 手动内参覆盖（SDK 无法获取时自动使用，例如 BAG 播放模式）
fx=608.879
fy=608.729
cx=631.332
cy=356.632
img_width=1280
img_height=720

[dirt_assessment]
# score = area_weight * IPM覆盖率(%) + 各类别权重 * 当前帧原始检测框数。
# score 不是覆盖率；等级按平滑后的 score 判断，覆盖率字段仍只表示 IPM 面积比。
area_weight=2.0
weight_liquid=4.2
weight_debris=4.5
weight_paper=3.4
weight_cable=3.0
weight_bottle=3.8
level_2_min_score=3.5
level_3_min_score=18.0
level_4_min_score=35.0
level_5_min_score=50.0
